# JOSM Plugin Properties File
# This file documents metadata about the Kaart Viewer plugin. Note: mirroring
# CR_PLUGIN's own layout, this file is NOT read by build.xml at build time -
# the same values are declared directly as Ant properties in build.xml, which
# is the copy that actually drives the manifest. Keep both in sync by hand.

plugin.version=0.1.0
plugin.name=KaartViewer
plugin.description=Shows Kaart Viewer street-level imagery coverage in JOSM, with one-click open-in-browser
plugin.author=Kaart
plugin.class=org.openstreetmap.josm.plugins.kaartviewer.KaartViewerPlugin
plugin.canloadatruntime=true

# Minimum JOSM version required
plugin.main.version=18000

# Plugin website and documentation
plugin.link=
plugin.icon=images/kaartviewer.png
