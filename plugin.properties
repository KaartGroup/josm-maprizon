# JOSM Plugin Properties File
# This file documents metadata about the Maprizon plugin. Note: mirroring
# CR_PLUGIN's own layout, this file is NOT read by build.xml at build time -
# the same values are declared directly as Ant properties in build.xml, which
# is the copy that actually drives the manifest. Keep both in sync by hand.

plugin.version=1.0.3
plugin.name=Maprizon
plugin.description=Shows Maprizon street-level imagery coverage in JOSM, with one-click open-in-browser
plugin.author=Kaart
plugin.class=org.openstreetmap.josm.plugins.maprizon.MaprizonPlugin
plugin.canloadatruntime=true

# Minimum JOSM version required
plugin.main.version=19481

# Plugin website and documentation
plugin.link=https://github.com/KaartGroup/josm-maprizon
plugin.icon=images/maprizon.png
